<title>Дея — сторінку не знайдено</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EDF0F3; color: #0F1A2A;
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #11161E; color: #EEF2F8; } }

</head>
<body>
<div>
  <img id="icon" src="/img/icon.png" alt="">
  <p>Де я? Такої сторінки немає.</p>
  <p><a id="home" href="/">На головну</a></p>
</div>
<script>
  // Works both on GitHub Pages (/deya-site/) and at a domain root (Vercel).
  var base = location.pathname.indexOf('/deya-site/') === 0 ? '/deya-site/' : '/';
  document.getElementById('icon').src = base + 'img/icon.png';
  document.getElementById('home').href = base;
  setTimeout(function () { location.replace(base); }, 3000);
</script>
